[project]
name = "vrcp-classification"
version = "0.1.0"
description = "Verifiably Robust Conformal Prediction -- classification experiments (CIFAR10, CIFAR100, TinyImageNet)"
requires-python = "~=3.11.0"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "seaborn",
    "scikit-learn",
    "scipy",
    "tqdm",
    "torchattacks",
    "strictyaml>=1.7",
    "auto-lirpa",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
auto-lirpa = { git = "https://github.com/Verified-Intelligence/auto_LiRPA", rev = "5a098e8f9fb5786a428a024981d833d303921f2d" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["VRCP"]
