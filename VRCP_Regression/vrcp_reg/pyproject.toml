[project]
name = "vrcp-regression"
version = "0.1.0"
description = "Verifiably Robust Conformal Prediction -- regression experiments (MPE environments)"
requires-python = "~=3.11.0"
dependencies = [
    "torch==2.11.0",
    "torchvision==0.26.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "matplotlib",
    "scikit-learn",
    "scipy",
    "tqdm",
    "strictyaml>=1.7",
    "auto-lirpa",
    "pettingzoo==1.22.3",
    "tianshou==0.5.0",
    "gymnasium==0.27.0",
    "tensorboard",
    "h5py",
    "numba",
    "pygame",
    "pymunk",
    "networkx",
    "requests",
    "pillow",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv.sources]
# Kept in lockstep with VRCP_Classification's pin -- see that project's
# pyproject.toml and the root CLAUDE.md for the shared-pin note.
auto-lirpa = { git = "https://github.com/Verified-Intelligence/auto_LiRPA", rev = "5a098e8f9fb5786a428a024981d833d303921f2d" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cqr", "nonconformist", "vrcp_reg", "vrcp_reg_config", "mpe_helper"]
